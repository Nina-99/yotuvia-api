name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The VPS downloads these assets anonymously (public repo) instead of building
# from source: the same bytes that passed CI are the bytes that get installed.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      # A tag can point at a commit that never went through CI. Run the suite on
      # one architecture only: the tests do not depend on GOARCH.
      - name: Test
        if: matrix.arch == 'amd64'
        run: go test ./... -count=1

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o yotuvia-api .

      - name: Package
        run: |
          NAME="yotuvia-api-linux-${{ matrix.arch }}"
          tar -czf "$NAME.tar.gz" yotuvia-api
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          cat "$NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: api-linux-${{ matrix.arch }}
          path: yotuvia-api-linux-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error

  release:
    name: publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
